<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task Manager</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main class="shell"><header class="page-header"><div><p class="eyebrow">TEAM PROJECT · IT</p><h1>Task Manager</h1></div><span class="student">Student ID: <strong id="student-id">74149</strong></span></header>
<section class="panel composer"><h2 id="form-heading">Create a task</h2><form id="task-form"><label for="task-title">Title</label><input id="task-title" name="title" type="text" required maxlength="200" placeholder="What needs to get done?"><label for="task-description">Description <span>(optional)</span></label><textarea id="task-description" name="description" rows="3" placeholder="Add a few details"></textarea><div class="form-actions"><button id="task-submit" class="primary" type="submit">Add task</button><button id="cancel-edit" class="quiet" type="button" hidden>Cancel edit</button></div></form></section>
<section class="tasks-section"><div class="section-heading"><div><p class="eyebrow">YOUR WORKSPACE</p><h2>Tasks</h2></div><span id="task-count" class="count">—</span></div><p id="status-message" role="status" aria-live="polite">Loading tasks…</p><div id="task-list" class="task-list" aria-live="polite"></div></section><footer><a id="contribution-link" href="contribution.html">Team contribution <span aria-hidden="true">↗</span></a></footer></main></body></html>
